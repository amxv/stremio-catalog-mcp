name: API deployment

# Do not request a Vercel deployment for docs, Android TV, or unrelated commits.
on:
  push:
    branches: [main]
    paths: &api_paths
      - 'api/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [main]
    paths: *api_paths
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: api-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify API before deployment
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy only changed API code
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          flags=()
          if [ "$EVENT_NAME" != 'pull_request' ]; then flags+=(--prod); fi
          deployment="$(npx --yes vercel@65.1.0 deploy --json --yes --non-interactive "${flags[@]}" --token "$VERCEL_TOKEN")"
          url="$(printf '%s\n' "$deployment" | jq -er '.deployment.url')"
          [[ "$url" == https://* ]] || { echo "Vercel CLI did not return a deployment URL" >&2; exit 1; }
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'API deployment: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish preview on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.url }}
        with:
          script: |
            const marker = '<!-- stremio-api-preview -->';
            const body = `${marker}\nAPI preview: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

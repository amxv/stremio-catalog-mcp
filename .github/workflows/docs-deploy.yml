name: Docs

# Paths are evaluated by GitHub before a Vercel deployment is requested.
on:
  push:
    branches: [main]
    paths:
      - "docs/src/**"
      - "docs/public/**"
      - "docs/package.json"
      - "docs/bun.lock"
      - "docs/astro.config.mjs"
      - "docs/tsconfig.json"
      - "docs/vercel.json"
      - "docs/scripts/prepare-prebuilt.mjs"
  pull_request:
    branches: [main]
    paths:
      - "docs/src/**"
      - "docs/public/**"
      - "docs/package.json"
      - "docs/bun.lock"
      - "docs/astro.config.mjs"
      - "docs/tsconfig.json"
      - "docs/vercel.json"
      - "docs/scripts/prepare-prebuilt.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test deployment contract and output
        working-directory: docs
        run: node --test scripts/deployment.test.mjs scripts/prepare-prebuilt.test.mjs
      - name: Check documentation
        run: bun run check
      - name: Build static site in CI
        if: >-
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) &&
          github.repository != 'amxv/go-mcp-template'
        run: |
          set -euo pipefail
          bun run build
          node scripts/prepare-prebuilt.mjs
      - name: Deploy production site
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.repository != 'amxv/go-mcp-template'
        # Run the Vercel CLI from repo root (its configured root may be a subfolder).
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Public forks can run docs checks without hosting their own copy of
          # the site. Only deploy when this repository has its own credentials.
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Docs CI passed; no Vercel docs deployment configured for this repository."
            exit 0
          fi
          mkdir -p .vercel
          mv docs/.vercel/output .vercel/output
          npx --yes vercel@latest deploy --prebuilt --prod --yes --non-interactive
      - name: Deploy preview only for docs changes
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.repository != 'amxv/go-mcp-template'
        id: preview
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo 'No Vercel docs deployment configured for this fork.'
            exit 0
          fi
          mkdir -p .vercel
          mv docs/.vercel/output .vercel/output
          url="$(npx --yes vercel@latest deploy --prebuilt --yes --non-interactive)"
          url="${url%%$'\n'*}"
          [[ "$url" == https://* ]] || { echo "Vercel CLI did not return a deployment URL" >&2; exit 1; }
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Docs preview: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish docs preview on pull request
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- stremio-docs-preview -->';
            const body = `${marker}\nDocs preview: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
